<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video hướng dẫn lắp Robot Chó</title>
  <style>
    :root { --bg:#0e1217; --panel:#171d25; --line:#2a3542; --text:#eef3f8; --muted:#8fa3b8; --acc:#2ec4b6; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Segoe UI,system-ui,sans-serif; background:var(--bg); color:var(--text); }
    header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    h1 { margin:0; font-size:17px; font-weight:600; }
    h1 span { color:var(--acc); }
    .stage { max-width:1100px; margin:0 auto; padding:16px; }
    .frame {
      position:relative; background:#000; border:1px solid var(--line); border-radius:10px;
      aspect-ratio:16/9; overflow:hidden; display:flex; align-items:center; justify-content:center;
    }
    .frame img { width:100%; height:100%; object-fit:contain; display:block; }
    .badge {
      position:absolute; left:12px; top:12px; background:rgba(0,0,0,.65); color:var(--acc);
      padding:6px 10px; border-radius:6px; font-size:12px; font-weight:600;
    }
    .controls { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; align-items:center; }
    button, select {
      background:#223041; color:var(--text); border:1px solid var(--line);
      padding:10px 14px; border-radius:8px; cursor:pointer; font-size:13px;
    }
    button:hover { border-color:var(--acc); }
    button.primary { background:#134e4a; border-color:var(--acc); color:var(--acc); }
    .bar { flex:1; min-width:160px; height:8px; background:#223041; border-radius:99px; overflow:hidden; }
    .bar > i { display:block; height:100%; width:0; background:var(--acc); }
    .thumbs { display:grid; grid-template-columns:repeat(8,1fr); gap:8px; margin-top:14px; }
    .thumbs button {
      padding:0; overflow:hidden; border-radius:6px; opacity:.55; aspect-ratio:16/9;
    }
    .thumbs button.active, .thumbs button:hover { opacity:1; border-color:var(--acc); }
    .thumbs img { width:100%; height:100%; object-fit:cover; display:block; }
    .note { color:var(--muted); font-size:13px; margin-top:14px; line-height:1.5; }
  </style>
</head>
<body>
  <header>
    <h1>Video hướng dẫn lắp <span>Robot Chó</span> — 7 bước</h1>
    <div id="clock">00:00 / 00:00</div>
  </header>
  <div class="stage">
    <div class="frame">
      <img id="slide" alt="Bước hướng dẫn" />
      <div class="badge" id="badge">Bước 0</div>
    </div>
    <div class="controls">
      <button id="prev">◀ Trước</button>
      <button id="play" class="primary">▶ Phát</button>
      <button id="next">Sau ▶</button>
      <select id="speed">
        <option value="2500">Chậm (2.5s)</option>
        <option value="1800" selected>Vừa (1.8s)</option>
        <option value="1200">Nhanh (1.2s)</option>
      </select>
      <div class="bar"><i id="progress"></i></div>
    </div>
    <div class="thumbs" id="thumbs"></div>
    <p class="note">
      Đây là slideshow tự chạy (giống video hướng dẫn). Ảnh gốc nằm trong thư mục
      <code>huong-dan/</code>. Mở file này bằng trình duyệt hoặc vào
      <a href="/huong-dan-video.html" style="color:var(--acc)">huong-dan-video.html</a> nếu đang chạy server local.
      Phím tắt: Space phát/dừng · ← → chuyển bước.
    </p>
  </div>
<script>
const slides = [
  { src: "huong-dan/huong-dan-00-bia.png", title: "Bìa — Hướng dẫn lắp ráp" },
  { src: "huong-dan/huong-dan-01-khung.png", title: "Bước 1 — Chuẩn bị khung" },
  { src: "huong-dan/huong-dan-02-servo.png", title: "Bước 2 — Lắp 8 servo MG90S" },
  { src: "huong-dan/huong-dan-03-nguon.png", title: "Bước 3 — Lắp nguồn XL4015" },
  { src: "huong-dan/huong-dan-04-board.png", title: "Bước 4 — Gắn board vào thân" },
  { src: "huong-dan/huong-dan-05-tin-hieu.png", title: "Bước 5 — Nối tín hiệu GPIO" },
  { src: "huong-dan/huong-dan-06-checklist.png", title: "Bước 6 — Checklist trước khi bật" },
  { src: "huong-dan/huong-dan-07-nap-code.png", title: "Bước 7 — Nạp code & chỉnh đứng" },
];

let i = 0, playing = false, timer = null;
const img = document.getElementById("slide");
const badge = document.getElementById("badge");
const progress = document.getElementById("progress");
const playBtn = document.getElementById("play");
const thumbs = document.getElementById("thumbs");
const clock = document.getElementById("clock");

slides.forEach((s, idx) => {
  const b = document.createElement("button");
  b.innerHTML = `<img src="${s.src}" alt="${s.title}">`;
  b.onclick = () => { go(idx); };
  thumbs.appendChild(b);
});

function fmt(ms) {
  const s = Math.floor(ms / 1000);
  return `0:${String(s).padStart(2,"0")}`;
}
function refreshClock() {
  const dur = slides.length * Number(document.getElementById("speed").value);
  const cur = i * Number(document.getElementById("speed").value);
  clock.textContent = `${fmt(cur)} / ${fmt(dur)}`;
}
function go(n) {
  i = (n + slides.length) % slides.length;
  img.src = slides[i].src;
  badge.textContent = slides[i].title;
  progress.style.width = ((i + 1) / slides.length * 100) + "%";
  [...thumbs.children].forEach((el, k) => el.classList.toggle("active", k === i));
  refreshClock();
}
function stop() {
  playing = false;
  playBtn.textContent = "▶ Phát";
  clearInterval(timer);
}
function start() {
  playing = true;
  playBtn.textContent = "⏸ Dừng";
  clearInterval(timer);
  timer = setInterval(() => {
    if (i >= slides.length - 1) { stop(); return; }
    go(i + 1);
  }, Number(document.getElementById("speed").value));
}
document.getElementById("prev").onclick = () => { stop(); go(i - 1); };
document.getElementById("next").onclick = () => { stop(); go(i + 1); };
playBtn.onclick = () => playing ? stop() : start();
document.getElementById("speed").onchange = () => { refreshClock(); if (playing) start(); };
document.addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); playing ? stop() : start(); }
  if (e.code === "ArrowLeft") { stop(); go(i - 1); }
  if (e.code === "ArrowRight") { stop(); go(i + 1); }
});
go(0);
</script>
</body>
</html>
